<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Comunícate con el equipo de Voltio Verde.">
    <title>Contacto | Voltio Verde</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/contacto.js" defer></script>
</head>
<body class="container py-3">
    <header class="encabezado">
        <a class="marca" href="index.html" aria-label="Voltio Verde, inicio">
            <span class="marca-icono" aria-hidden="true">VV</span>
            <span>Voltio Verde</span>
        </a>
        <p>¿Tienes preguntas? Nos gustaría leerte.</p>
        <nav class="menu" aria-label="Navegación principal">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html" aria-current="page">Contacto</a>
        </nav>
    </header>

    <main>
        <section class="formulario-contenedor">
            <h1>Escríbenos</h1>
            <p>Completa los campos y cuéntanos cómo podemos ayudarte.</p>
            <form id="formulario-contacto">
                <div class="campo-formulario">
                    <label for="nombre">Nombre completo</label>
                    <input class="form-control" id="nombre" name="nombre" type="text" autocomplete="name" required>
                </div>
                <div class="campo-formulario">
                    <label for="correo">Correo electrónico</label>
                    <input class="form-control" id="correo" name="correo" type="email" autocomplete="email" required>
                </div>
                <div class="campo-formulario">
                    <label for="telefono">Teléfono</label>
                    <input class="form-control" id="telefono" name="telefono" type="tel" autocomplete="tel" required>
                </div>
                <div class="campo-formulario">
                    <label for="tema">Tema de consulta</label>
                    <select class="form-select" id="tema" name="tema" required>
                        <option value="">Selecciona un tema</option>
                        <option value="productos">Productos y catálogo</option>
                        <option value="ahorro">Cálculo de ahorro</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>
                <div class="campo-formulario">
                    <label for="mensaje">Mensaje</label>
                    <textarea class="form-control" id="mensaje" name="mensaje" rows="5" required></textarea>
                </div>
                <button class="btn btn-primary" type="submit">Enviar mensaje</button>
                <p id="estado-formulario" class="estado-formulario" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer class="pie">
        <!--<p>Tu información se usa únicamente para responder esta consulta en esta demostración académica.</p>-->
        <p>Ingeniería Web I · IU Digital de Antioquia · 2026-2</p>
    </footer>
</body>
</html>
